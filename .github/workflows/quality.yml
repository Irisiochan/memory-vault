name: quality

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package tooling
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .

      - name: Test MCP and repository boundary
        run: |
          python tests/template_sync.py
          python tests/smoke.py
          python tests/fact_layer.py
          python tests/hub_auto_lifecycle.py
          python tests/module_parity.py
          python tests/protocol_smoke.py
          python tests/http_smoke.py
          python tests/repository_boundary.py

      - name: Build Python package
        run: python -m build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build MCP image
        run: docker build -t memory-vault-mcp:${{ github.sha }} .
